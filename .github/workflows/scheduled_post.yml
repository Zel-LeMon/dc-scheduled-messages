name: Scheduled Discord Announcement

on:
  schedule:
    # Schedule using POSIX cron syntax (UTC Time Zone)
    # Example below runs every Monday at 14:00 UTC (9:00 AM EST)
    - cron: '0 14 * * 1'
  
  # Allows you to manually trigger the message anytime from GitHub to test it
  workflow_dispatch:

jobs:
  post-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook Message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "Hello everyone! This is your scheduled weekly announcement. 🚀"}' \
               $DISCORD_WEBHOOK
