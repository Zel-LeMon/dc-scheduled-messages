name: Dynamic Event Reminders

concurrency:
  group: discord-event-countdown
  cancel-in-progress: false

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Check Schedule & Run Sequence
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CSV_URL: ${{ secrets.SCHEDULE_CSV_URL }}
        run: python scripts/runner.py
